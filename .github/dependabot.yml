version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    versioning-strategy: increase
    labels:
      - dependencies
    groups:
      dev-dependencies:
        dependency-type: development
    ignore:
      # TypeScript 7 peer requirements aren't yet satisfied by typescript-eslint
      # (peer range caps at <6.1.0). Remove this once typescript-eslint ships TS 7 support.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
